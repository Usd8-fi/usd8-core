[package]
name = "usd8-score-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
publish = false
license = "BUSL-1.1"

[features]
default = []
sepolia = ["usd8-settlement/sepolia"]
lambda = [
  "dep:aws-config",
  "dep:aws-sdk-dynamodb",
  "dep:aws-types",
  "dep:lambda_http",
]

[[bin]]
name = "usd8-score-lambda"
path = "src/bin/lambda.rs"
required-features = ["lambda"]

[dependencies]
aws-config = { version = "=1.10.0", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
aws-sdk-dynamodb = { version = "=1.119.0", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
aws-types = { version = "=1.5.0", optional = true }
lambda_http = { version = "=1.3.0", optional = true }
num-bigint = "=0.5.1"
num-traits = "=0.2.19"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
thiserror = "=2.0.18"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread"] }
usd8-score-core = { path = "../score-core" }
usd8-settlement = { path = ".." }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
